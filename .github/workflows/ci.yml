name: Build Verification (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    name: Verify Maven & Node.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'gateway/package-lock.json'

      - name: Test Maven Plugin Build
        run: |
          cd plugin
          mvn clean package

      - name: Test Gateway TypeScript Build
        run: |
          cd gateway
          npm ci
          npm run build
