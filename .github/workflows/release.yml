name: Build & Release NightSFTP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Plugin & Gateway Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'gateway/package-lock.json'

      - name: Build Minecraft Plugin (Maven)
        run: |
          cd plugin
          mvn clean package -DskipTests
          mkdir -p ../dist_release
          cp target/NightSFTP-1.0.0.jar ../dist_release/NightSFTP.jar

      - name: Build Gateway Project
        run: |
          cd gateway
          npm ci
          npm run build
          mkdir -p ../dist_release/gateway
          cp -r dist package.json package-lock.json config.example.yml Dockerfile README.md ../dist_release/gateway/
          cd ../dist_release/gateway
          zip -r ../gateway.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_release/NightSFTP.jar
            dist_release/gateway.zip
          name: NightSFTP Release ${{ github.ref_name }}
          body: |
            ## 🚀 NightSFTP Release ${{ github.ref_name }}

            ### 📦 Yayınlanan Paketler:
            - **`NightSFTP.jar`**: Minecraft Sunucuları için Spigot/Paper Eklentisi
            - **`gateway.zip`**: Gateway Proxy Sunucusu (Node.js / TypeScript)

            ---
            *Otomatik olarak GitHub Actions tarafından Maven & Node.js yapılandırması ile derlenmiştir.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
